aid: kufu
name: KUFU
description: >-
  KUFU, Inc. is the founding name of SmartHR, Inc., the Japanese cloud HR
  platform, and remains the company's GitHub organization identity. SmartHR is
  a system of record for employee data across Japanese back-office HR — hiring
  and onboarding, social insurance and labour paperwork, family and dependent
  records, organizational structure, payslips, and withholding tax slips. The
  SmartHR API is a tenant-scoped REST API on a per-customer subdomain,
  described by a live Swagger 2.0 document covering 60 paths and 120
  operations, and is offered free to existing SmartHR customers. It ships a
  webhook event surface, an application-gated sandbox on a separate domain, and
  an open-source React component library, but no official client SDK.
