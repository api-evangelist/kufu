openapi: 3.2.0
info:
  title: SmartHR Webhook API
  description: SmartHR の各種データを操作する API です
  license:
    name: SmartHR, Inc
  version: 0.0.1
servers:
- url: https://app.smarthr.jp/api
tags:
- name: Webhook
  description: Webhook を操作します
paths:
  /v1/webhooks/{id}:
    get:
      summary: 取得
      description: 指定した ID の Webhook 情報を取得します。
      parameters:
      - in: path
        name: id
        description: Webhook ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: getV1WebhooksId
    put:
      summary: 更新
      description: '指定した ID の Webhook 情報を更新します。

        未指定の属性は情報が削除されます。未指定の属性を消したくない場合は「部分更新」をご利用ください。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "url": "https://example.com/",

        "crew_created": true,

        "crew_updated": false,

        "crew_deleted": true,

        "crew_imported": false

        }

        ```'
      parameters:
      - in: path
        name: id
        description: Webhook ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: putV1WebhooksId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putV1WebhooksId'
        required: true
    patch:
      summary: 部分更新
      description: '指定した ID の Webhook 情報を部分更新します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "crew_created": false,

        "crew_updated": true

        }

        ```'
      parameters:
      - in: path
        name: id
        description: Webhook ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 部分更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: patchV1WebhooksId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchV1WebhooksId'
        required: true
    delete:
      summary: 削除
      description: 指定した ID の Webhook 情報を削除します。
      parameters:
      - in: path
        name: id
        description: Webhook ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: (no content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: deleteV1WebhooksId
  /v1/webhooks:
    get:
      summary: リストの取得
      description: Webhook をリストで取得します。
      parameters:
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: リストの取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: getV1Webhooks
    post:
      summary: 登録
      description: 'Webhook を新規登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "url": "https://example.com/",

        "crew_created": true,

        "crew_updated": false,

        "crew_deleted": true,

        "crew_imported": false

        }

        ```'
      responses:
        '201':
          description: 登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
      tags:
      - Webhook
      operationId: postV1Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1Webhooks'
        required: true
