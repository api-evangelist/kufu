          description: 説明
        crew_created:
          type: boolean
          description: 従業員情報が作成されたときに通知するかどうか
        crew_updated:
          type: boolean
          description: 従業員情報が更新されたときに通知するかどうか
        crew_deleted:
          type: boolean
          description: 従業員情報が削除されたときに通知するかどうか
        crew_imported:
          type: boolean
          description: 従業員情報がインポートされたときに通知するかどうか
        dependent_created:
          type: boolean
          description: 家族情報が作成されたときに通知するかどうか
        dependent_updated:
          type: boolean
          description: 家族情報が更新されたときに通知するかどうか
        dependent_deleted:
          type: boolean
          description: 家族情報が削除されたときに通知するかどうか
        dependent_imported:
          type: boolean
          description: 家族情報がインポートされたときに通知するかどうか
        expose_only_id:
          type: boolean
          description: 変更されたデータのIDのみ送信する
        disabled_at:
          type: string
          format: date
          description: 無効化された日時
        access_type:
          type: string
          description: アクセス種別
          enum:
          - read_and_update
          - hidden
          - read_and_update_only_origin
        secret_token:
          type: string
          description: 通知に付与される Secret Token
      required:
      - crew_created
      - crew_updated
      - crew_deleted
      - crew_imported
      - dependent_created
      - dependent_updated
      - dependent_deleted
      - dependent_imported
