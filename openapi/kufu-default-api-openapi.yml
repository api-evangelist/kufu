openapi: 3.2.0
info:
  title: SmartHR カスタム家族項目テンプレート API
  description: SmartHR の各種データを操作する API です
  license:
    name: SmartHR, Inc
  version: 0.0.1
servers:
- url: https://app.smarthr.jp/api
tags:
- name: カスタム家族項目テンプレート
  description: カスタム家族項目テンプレートを操作します
paths:
  /v1/dependent_custom_field_templates:
    get:
      summary: リストの取得
      description: カスタム家族項目をリストで取得します。
      parameters:
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: リストの取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DependentCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1DependentCustomFieldTemplates
  /v1/crew_custom_field_template_groups/{id}:
    get:
      summary: 取得
      description: '指定した ID のカスタム従業員項目グループ情報を取得します。


        `embed=templates` を指定すると、そのグループに属するカスタム項目テンプレート情報も合わせて取得できます。'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目グループID
        required: true
        schema:
          type: string
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - templates
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1CrewCustomFieldTemplateGroupsId
    put:
      summary: 更新
      description: '指定した ID のカスタム従業員項目グループ情報を更新します。

        未指定の属性は情報が削除されます。未指定の属性を消したくない場合は「部分更新」をご利用ください。


        以下のスキーマで JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        ```

        {

        "name": "string",

        "position": 0

        }

        ```'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目グループID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: putV1CrewCustomFieldTemplateGroupsId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putV1CrewCustomFieldTemplateGroupsId'
        required: true
    patch:
      summary: 部分更新
      description: '指定した ID のカスタム従業員項目グループ情報を部分更新します。


        以下のスキーマで JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        ```

        {

        "name": "string",

        "position": 0

        }

        ```'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目グループID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 部分更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: patchV1CrewCustomFieldTemplateGroupsId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchV1CrewCustomFieldTemplateGroupsId'
        required: true
    delete:
      summary: 削除
      description: '指定した ID のカスタム従業員項目グループ情報を削除します。


        **グループに属するカスタム項目テンプレート、およびそれらのテンプレートに対して設定されている値がすべて削除されます。**'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目グループID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: (no content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: deleteV1CrewCustomFieldTemplateGroupsId
  /v1/crew_custom_field_template_groups:
    get:
      summary: リスト取得
      description: 'カスタム従業員項目グループをリストで取得します。


        `embed=templates` を指定すると、そのグループに属するカスタム項目テンプレート情報も合わせて取得できます。'
      parameters:
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - templates
      responses:
        '200':
          description: リスト取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1CrewCustomFieldTemplateGroups
    post:
      summary: 登録
      description: 'カスタム従業員項目グループを新規登録します。


        以下のスキーマで JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        ```

        {

        "name": "string",

        "position": 0

        }

        ```'
      responses:
        '201':
          description: 登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplateGroup'
      tags:
      - カスタム家族項目テンプレート
      operationId: postV1CrewCustomFieldTemplateGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1CrewCustomFieldTemplateGroups'
        required: true
  /v1/crew_custom_field_templates:
    get:
      summary: リストの取得
      description: 'カスタム従業員項目をリストで取得します。


        `embed=group` を指定すると、属するカスタム項目グループ情報も合わせて取得できます。（ `group_id` が `group` に置き換わります）'
      parameters:
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - group
      responses:
        '200':
          description: リストの取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1CrewCustomFieldTemplates
    post:
      summary: 登録
      description: 'カスタム従業員項目を新規登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "name": "身長",

        "type": "decimal",

        "scale": 1

        }

        ```


        なお、種別がドロップダウンリスト項目（type: enum）の時のみ、 `elements` アトリビュートで要素を指定できます。


        JSON 例

        ```

        {

        "name": "血液型",

        "type": "enum",

        "elements": [

        { "name": "A型", "position": 1 },

        { "name": "B型", "position": 2 },

        ...

        ]

        }

        ```'
      responses:
        '201':
          description: 登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: postV1CrewCustomFieldTemplates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1CrewCustomFieldTemplates'
        required: true
  /v1/crew_custom_field_templates/{id}:
    get:
      summary: 取得
      description: '指定した ID のカスタム従業員項目情報を取得します。


        `embed=group` を指定すると、属するカスタム項目グループ情報も合わせて取得できます。（ `group_id` が `group` に置き換わります）'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目ID
        required: true
        schema:
          type: string
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - group
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1CrewCustomFieldTemplatesId
    put:
      summary: 更新
      description: '指定した ID のカスタム従業員項目情報を更新します。

        未指定の属性は情報が削除されます。未指定の属性を消したくない場合は「部分更新」をご利用ください。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "name": "身長",

        "type": "decimal",

        "scale": 1

        }

        ```


        なお、種別がドロップダウンリスト項目（type: enum）の時のみ、 `elements` アトリビュートで要素を指定できます。


        既存の elements 要素を更新する場合は `id` を指定してください。この時、指定されなかった既存の要素はすべて削除されます。


        JSON 例

        ```

        {

        "name": "血液型",

        "type": "enum",

        "elements": [

        { "id", 1, "name": "A型", "position": 1 },

        { "name": "AB型", "position": 3 },

        ...

        ]

        }

        ```'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: putV1CrewCustomFieldTemplatesId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putV1CrewCustomFieldTemplatesId'
        required: true
    patch:
      summary: 部分更新
      description: '指定した ID のカスタム従業員項目情報を部分更新します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "name": "身長",

        "type": "decimal",

        "scale": 1

        }

        ```


        なお、種別がドロップダウンリスト項目（type: enum）の時のみ、 `elements` アトリビュートで要素を指定できます。


        既存の elements 要素を更新する場合は `id` を指定してください。


        JSON 例

        ```

        {

        "name": "血液型",

        "type": "enum",

        "elements": [

        { "id", 1, "name": "A型", "position": 1 },

        { "name": "AB型", "position": 3 },

        ...

        ]

        }

        ```'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 部分更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: patchV1CrewCustomFieldTemplatesId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchV1CrewCustomFieldTemplatesId'
        required: true
    delete:
      summary: 削除
      description: '指定した ID のカスタム従業員項目情報を削除します。


        **テンプレートに対して設定されている値がすべて削除されます。**'
      parameters:
      - in: path
        name: id
        description: カスタム従業員項目ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: (no content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
      tags:
      - カスタム家族項目テンプレート
      operationId: deleteV1CrewCustomFieldTemplatesId
  /v1/batch_jobs:
    get:
      summary: リストの取得
      description: バックグラウンド処理をリストで取得します。
      parameters:
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - attachments
      - in: query
        name: sort
        description: 並び順
        required: false
        schema:
          type: string
          enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          default: created_at
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: リストの取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchJob'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1BatchJobs
  /v1/batch_jobs/{id}:
    get:
      summary: 取得
      description: 指定した ID のバックグラウンド処理を取得します。
      parameters:
      - in: path
        name: id
        description: BatchJob ID
        required: true
        schema:
          type: string
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - attachments
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJob'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1BatchJobsId
  /v1/batch_jobs/job_types/crew_export:
    post:
      summary: 従業員情報ダウンロードの登録
      description: 'バックグラウンド処理（従業員情報ダウンロード）を登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "crew_export_format_id": "8d155019-0a3d-4c75-ab5e-8948a0d7b423"

        }

        ```


        事前にカスタムダウンロードフォーマットを作成し、その ID を指定してください。ID は URL のパスより確認が可能です。


        例: 「/admin/crew_export_formats/8d155019-0a3d-4c75-ab5e-8948a0d7b423」であれば「8d155019-0a3d-4c75-ab5e-8948a0d7b423」'
      responses:
        '201':
          description: 従業員情報ダウンロードの登録
      tags:
      - カスタム家族項目テンプレート
      operationId: postV1BatchJobsJobTypesCrewExport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1BatchJobsJobTypesCrewExport'
        required: true
  /v1/batch_jobs/job_types/crew_import:
    post:
      summary: 従業員一括登録・更新の登録
      description: 'バックグラウンド処理（従業員一括登録・更新）を登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "mode": "insert",

        "file": {

        "name": "sample.csv",

        "content": "5YiXMSzliJcyCmEsYgpjLGQKZSxmCg=="

        }

        }

        ```'
      responses:
        '201':
          description: 従業員一括登録・更新の登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJob'
      tags:
      - カスタム家族項目テンプレート
      operationId: postV1BatchJobsJobTypesCrewImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1BatchJobsJobTypesCrewImport'
        required: true
  /v1/batch_jobs/job_types/dependent_import:
    post:
      summary: 家族情報一括更新の登録
      description: 'バックグラウンド処理（家族情報一括更新）を登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "file": {

        "name": "sample.csv",

        "content": "5YiXMSzliJcyCmEsYgpjLGQKZSxmCg=="

        }

        }

        ```'
      responses:
        '201':
          description: 家族情報一括更新の登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJob'
      tags:
      - カスタム家族項目テンプレート
      operationId: postV1BatchJobsJobTypesDependentImport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postV1BatchJobsJobTypesDependentImport'
        required: true
  /v1/batch_job_attachments/{id}/file:
    get:
      summary: ファイル取得
      description: '指定した ID のバックグラウンド処理添付ファイルを取得します。


        取得してから5分後にファイルは削除され、アクセスできなくなります。'
      parameters:
      - in: path
        name: id
        description: BatchJobAttachment ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ファイル取得
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1BatchJobAttachmentsIdFile
  /v1/mail_formats:
    get:
      summary: リストの取得
      description: メールフォーマット情報をリストで取得します。
      parameters:
      - in: query
        name: page
        description: Page of results to fetch.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: per_page
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - crew_input_forms
      responses:
        '200':
          description: リストの取得
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MailFormat'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1MailFormats
  /v1/mail_formats/{id}:
    get:
      summary: 取得
      description: 指定した ID のメールフォーマット情報を取得します。
      parameters:
      - in: path
        name: id
        description: メールフォーマットID
        required: true
        schema:
          type: string
      - in: query
        name: embed
        description: 埋め込むオブジェクト
        required: false
        schema:
          type: string
          enum:
          - crew_input_forms
      responses:
        '200':
          description: 取得
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailFormat'
      tags:
      - カスタム家族項目テンプレート
      operationId: getV1MailFormatsId
  /v1/users:
    get:
      summary: リストの取得
      description: 'ユーザー情報をリストで取得します。


        **招待のステータスについて**


        ユーザーに送信した招待は項目の値によって以下のように判定できます。


        - 従業員登録済み

        - `invitation_answered_at` に値が入っている

        - ユーザー登録済み

        - `invitation_created_at` が `null` である

        - 招待メール開封済み

        - `invitation_opened_at` に値が入っている

        - 招待メール送信済み

