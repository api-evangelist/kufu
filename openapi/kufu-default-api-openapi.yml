        **社会保険の資格取得年月日・社会保険の資格喪失年月日の設定について**


        社会保険データの構造変更に伴い、`soc_ins_qualified_at`、`soc_ins_disqualified_at` パラメータの利用は非推奨となりました。

        今後は `health_insurance_qualified_at` (= 健康保険の資格取得年月日)、`health_insurance_disqualified_at` (= 健康保険の資格喪失年月日)、`employees_pension_insurance_qualified_at` (= 厚生年金保険の資格取得年月日)、`employees_pension_insurance_disqualified_at` (= 厚生年金保険の資格喪失年月日) パラメータをご利用ください。


        なお、従来の `soc_ins_qualified_at`、`soc_ins_disqualified_at` パラメータは健康保険と厚生年金保険を区別せず同一の日付を設定していましたが、新しいパラメータでは保険種別ごとに個別の日付を設定できます。


        詳しくは お知らせ をご確認ください。


        **口座情報について**


        口座情報データの構造変更に伴い、bank_accounts パラメータのオブジェクトに `bank_account_setting_id` (= 口座設定ID) の指定が可能になりました。


        `bank_account_setting_id` を指定した場合は、以下のような挙動になります。


        - `bank_account_setting_id` を含まないパラメータが混在している場合、リクエストエラーとなります

        - 存在しない `bank_account_setting_id` を指定した場合はリクエストエラーとなります


        `bank_account_setting_id` を指定しなかった場合は、以下のような挙動になります。


        - パラメータの先頭から順にデータを突合し、登録・更新を行ないます

        - 有効な口座設定の数を越えたパラメータが指定された場合、リクエストエラーとなります

        - `bank_account_setting_id` を含むパラメータが混在している場合、リクエストエラーとなります


        **カスタム項目値の設定について**


        カスタム項目値の設定は `custom_fields` パラメータで行ないます。 `value` に設定する値は、テンプレート種別に対応させてください。


        JSON 例

        ```

        {

        "custom_fields": [

        {

        "template_id": "1234567a-123a-123a-123a-123456789aa",

        "value": "string"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ab",

        "value": "text"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ac",

        "value": 0

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ad",

        "value": "2017-03-09"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ae",

        "value": "enum_element_physical_name"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789af",

        "value": "/9j/4AAQSkZJRgABAQAASABIAAD/4QCMRXhpZgAATU0AK...",

        "file_name": "awesome_image.jpg"

        }

        ]

        }

        ```


        - ドロップダウンリスト（type: enum）は、ドロップダウンリスト要素の ID か、`physical_name` の設定値を使って指定します

        - ファイルは、データを Base64 エンコードした文字列を指定し、かつ `file_name` にデータの名前を拡張子付きで指定します

        - 指定した `template_id` の値がすでにある場合は、それを更新します'
      parameters:
      - in: path
        name: id
        description: 従業員ID
        required: true
