    post:
      summary: 登録
      description: '家族情報を新規登録します。


        BODY SAMPLE と BODY SCHEMA を参考に JSON 文字列を構築してリクエストボディに詰め、リクエストヘッダーの `Content-Type` に `application/json` を指定してリクエストしてください。


        JSON 例

        ```

        {

        "last_name": "山田",

        "first_name": "太郎",

        "relation_id": "xxxx",

        "gender": "male",

        "birth_at": "1960-01-01",

        "live_together_type": "living_together"

        }

        ```


        - `tax_law_support_type` パラメータを指定しない場合、`supported` を設定します。

        - `social_insurance_support_type` パラメータを指定しない場合、`supported` を設定します。


        **カスタム項目の値の設定について**


        カスタム項目の値の設定は `custom_fields` パラメータで行ないます。 `value` に設定する値は、テンプレート種別に対応させてください。


        JSON 例

        ```

        {

        "custom_fields": [

        {

        "template_id": "1234567a-123a-123a-123a-123456789aa",

        "value": "string"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ab",

        "value": "text"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ac",

        "value": 0

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ad",

        "value": "2017-03-09"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789ae",

        "value": "enum_element_physical_name"

        },

        {

        "template_id": "1234567a-123a-123a-123a-123456789af",

        "value": "/9j/4AAQSkZJRgABAQAASABIAAD/4QCMRXhpZgAATU0AK...",

        "file_name": "awesome_image.jpg"

        }

        ]

        }

        ```


        - ドロップダウンリスト（type: enum）の場合、 `value` にはドロップダウンリスト項目の ID か、 `physical_name` の値を指定します

        - ファイル（type: file）の場合、 `value` にはデータを Base64 エンコードした文字列を指定し、かつ `file_name` にデータの名前を拡張子付きで指定します'
