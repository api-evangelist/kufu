description: >-
  Versioning, change-communication and availability posture for the SmartHR
  API. SmartHR versions in the URI path (v1) and communicates changes through a
  dedicated API release-notes channel in its help center. No formal deprecation
  policy, sunset-header practice, or public status page was found.

versioning:
  scheme: uri-path
  current_version: v1
  format: https://{subdomain}.smarthr.jp/api/v1/{resource}
  spec_info_version: '0.0.1'
  note: >-
    info.version in the Swagger document ("0.0.1") tracks the document, not the
    v1 contract. Only one API version has ever been published.

