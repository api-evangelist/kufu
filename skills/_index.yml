cross_cutting_rules:
  idempotency: >-
    Not supported. No idempotency key exists, so a retried POST can duplicate
    records. Every skill reconciles by reading before retrying.
  rate_limits: >-
    5,000/hour and 10/second per access token; 50,000/minute per subdomain.
    Watch x-rate-limit-* and x-intensive-rate-limit-* headers.
  pagination: >-
    page / per_page (max 100), with an RFC 5988 Link header and x-total-count.
  errors: >-
    Custom envelope {code, type, message, errors}; not RFC 9457. See
    errors/kufu-problem-types.yml.
  temporality: >-
    Records are bitemporal. Reads return state as of now; future-effective
    changes fire webhooks on the effective date.
  data_sensitivity: >-
    This API holds regulated Japanese personal data — My Number, basic pension
    numbers, bank accounts, salary, disability status, residency documents.
    Default to read-only, require human confirmation for writes, exclude
    destructive operations, and never route My Number values through an agent
    context.

