  - name: organization
    entities: [Company, BizEstablishment, Department, EmploymentType, Position, Grade, JobCategory, RecruitmentType, PaymentPeriod]
  - name: payroll
    entities: [Payroll, Payslip, Allowance, Deduction, Attendance, PayrollAggregate]
