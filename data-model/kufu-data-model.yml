description: >-
  Entity-relationship graph for the SmartHR API, derived from the 111
  definitions in the published Swagger 2.0 document. Relationships were
  computed from $ref links (embedded objects and arrays) and from
  id-reference fields. Crew (従業員 / employee) is the hub — nearly every other
  entity hangs off it. Descriptions of Japanese HR domain terms are translated
  from the spec's own field descriptions.

root_entity: Crew
entity_count: 111
id_format:
  type: string
  scheme: opaque string ids, no documented type prefixes
  note: >-
    Unlike prefixed-id providers, SmartHR ids carry no type discriminator, so
    an id alone does not identify its entity.

domains:
