reference_data:
  description: >-
    Tenant-configurable enumerations referenced from Crew. Each is a full CRUD
    resource rather than a fixed enum.
  entities:
    - {name: EmploymentType, label: 雇用形態, crew_field: employment_type}
    - {name: Position, label: 役職, crew_field: positions}
    - {name: Grade, label: 等級, crew_field: grade}
    - {name: JobCategory, label: 職種, crew_field: job_category}
    - {name: RecruitmentType, label: 採用区分, crew_field: recruitment_type}
    - {name: PaymentPeriod, label: 給与支給形態, crew_field: payment_period}
    - {name: DependentRelation, label: 続柄, crew_field: n/a (Dependent.relation)}

extensibility:
  mechanism: custom fields
  description: >-
    Tenants extend Crew and Dependent with typed custom fields.
    CrewCustomFieldTemplate defines a field (including enum elements via
    CrewCustomEnumFieldTemplateElement); CrewCustomFieldTemplateGroup groups
    them for display; values ride on Crew.custom_fields.
  entities: [CrewCustomFieldTemplate, CrewCustomFieldTemplateGroup, CrewCustomEnumFieldTemplateElement, DependentCustomFieldTemplate]

temporality:
  model: bitemporal
  description: >-
    HR records are effective-dated — a change can be booked now to take effect
    later. SmartHR open-sources the same model as the activerecord-bitemporal
    gem (packages/kufu-packages.yml). This is the single most important
    modelling fact for integrators: reading a Crew returns its state as of now,
    not the full history of booked changes.

