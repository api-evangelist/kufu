      method: POST
      path: /v1/webhooks
      mutating: true
      confirm: required

  excluded_from_candidate:
    - reason: >-
        Destructive operations (deleteV1CrewsId, deleteV1DepartmentsId,
        deleteV1PayrollsId and the other DELETE operations) are deliberately
        omitted from the candidate tool surface. Deleting an employee record in
        a system of record for statutory payroll data is not an agent-safe
        action.
    - reason: >-
        My Number (マイナンバー) operations are omitted — individual numbers are
        regulated under Japan's My Number Act and should never transit an agent
        context.

