    - name: get_batch_job
      operation: getV1BatchJobsId
      method: GET
      path: /v1/batch_jobs/{id}
      mutating: false
      description: Poll the status of an async import/export job.
    - name: create_employee
      operation: postV1Crews
      method: POST
      path: /v1/crews
      mutating: true
      confirm: required
    - name: update_employee
      operation: patchV1CrewsId
