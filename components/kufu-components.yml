generated: '2026-07-19'
method: searched
source: https://smarthr.design/ and https://github.com/kufu/smarthr-ui
description: >-
  SmartHR's client-side component surface. Unlike most providers in this
  catalog, these are NOT embeddable widgets that render a vendor-hosted
  experience against the SmartHR API — SmartHR UI is an open-source React
  component library published as part of the SmartHR Design System, used to
  build applications that look and behave like SmartHR (including third-party
  apps listed in the SmartHR app store). Recorded here because it is a real,
  first-party, client-side UI surface distinct from an API SDK.

