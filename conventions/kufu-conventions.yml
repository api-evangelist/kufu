generated: '2026-07-19'
method: searched
source: https://developer.smarthr.jp/api/about_api
description: >-
  Cross-cutting request/response conventions that apply to every SmartHR API
  operation — authentication style, pagination, sorting, rate-limit signaling,
  error envelope, versioning, and webhook suppression. Read from the SmartHR
  developer documentation and cross-checked against the published Swagger 2.0
  document. These are the runtime semantics the OpenAPI does not express.

base_url: https://{subdomain}.smarthr.jp/api
api_style: REST over HTTPS, JSON request and response bodies
content_type: application/json;charset=utf-8

authentication:
  scheme: HTTP Bearer token, or HTTP Basic with the access token as credential
  header: 'Authorization: Bearer ACCESS_TOKEN'
  issuance: Generated by a tenant administrator in the SmartHR admin dashboard.
  docs: https://developer.smarthr.jp/api/about_api
  detail: authentication/kufu-authentication.yml

idempotency:
  supported: false
  mechanism: none
  description: >-
    SmartHR documents no idempotency-key header and the Swagger document
    declares none. Retries of POST operations are not de-duplicated by the
    server. Clients performing bulk writes (postV1PayrollsPayrollIdPayslipsBulk,
    postV1BatchJobsJobTypesCrewImport) should reconcile via the batch-job
    status endpoints rather than blindly retrying.

pagination:
  style: page-number
  request_params:
    page:
      description: Page number to retrieve.
      default: 1
    per_page:
      description: Items per page.
      default: 10
      max: 100
  response_headers:
    Link: >-
      RFC 5988 link header carrying rel="first", rel="last", rel="next" and
      rel="prev" URLs.
    x-total-count: Total number of items matching the query.
  docs: https://developer.smarthr.jp/api/about_api

sorting:
  supported: true
  mechanism: >-
    A `sort` query parameter naming the property to order by. Multiple sort
    keys are combined with commas; a leading hyphen reverses to descending
    order (e.g. sort=-created_at,last_name).

filtering:
  supported: true
  description: >-
    List operations expose resource-specific query parameters (for example
    emp_status, emp_type, department_id on getV1Crews). See the per-operation
    parameters in openapi/kufu-smarthr-openapi.json.

field_expansion:
  supported: false
  description: >-
    No expand/sparse-fieldset parameter is documented. Related objects are
    returned either fully embedded (Crew embeds departments, bank_accounts,
    positions, custom_fields) or as bare *_id fields — the shape is fixed per
    endpoint. The Webhook resource offers a coarse equivalent via the
    `expose_only_id` flag, which reduces the delivered payload to IDs only.

metadata:
  supported: true
  mechanism: custom_fields
  description: >-
    SmartHR's extensibility model is custom employee/family fields rather than
    a free-form metadata bag. Templates are defined via
    crew_custom_field_templates and grouped by
    crew_custom_field_template_groups; values ride on Crew.custom_fields and
    Dependent.custom_fields.

request_tracing:
  request_id_header: none documented
  description: No documented per-request correlation id header.

versioning:
  scheme: URI path versioning
  current: v1
  format: https://{subdomain}.smarthr.jp/api/v1/{resource}
  spec_version_field: >-
    The Swagger document reports info.version "0.0.1", which tracks the
    document rather than the v1 API contract.
  detail: lifecycle/kufu-lifecycle.yml

error_envelope:
  format: custom JSON (not RFC 9457 problem+json)
  content_type: application/json;charset=utf-8
  fields:
    code: Machine-readable error code.
    type: Error category.
    message: Human-readable message.
    errors: >-
      Optional array describing per-field validation failures.
  detail: errors/kufu-problem-types.yml
  docs: https://developer.smarthr.jp/api/about_api

rate_limiting:
  limits:
    - scope: access token
      limit: 5000 requests
      window: 1 hour
    - scope: access token
      limit: 10 requests
      window: 1 second
    - scope: subdomain (tenant)
      limit: 50000 requests
      window: 1 minute
  response_headers:
    - prefix: x-rate-limit-*
      description: Remaining quota and reset time for the standard limit.
    - prefix: x-intensive-rate-limit-*
      description: >-
        Remaining quota and reset time for the burst / intensive (per-second)
        limit.
  docs: https://developer.smarthr.jp/api/about_api

webhook_suppression:
  supported: true
  mechanism: skip_sending_webhook=true
  description: >-
    Appending skip_sending_webhook=true to a write request suppresses webhook
    delivery for that operation — the standard guard against feedback loops
    when a webhook consumer writes back into SmartHR.
  detail: asyncapi/kufu-smarthr-webhooks.yml

bulk_and_async:
  description: >-
    Large imports and exports run as background jobs rather than synchronous
    calls. Submit via postV1BatchJobsJobTypesCrewImport,
    postV1BatchJobsJobTypesCrewExport or
    postV1BatchJobsJobTypesDependentImport, then poll getV1BatchJobsId and
    retrieve output through getV1BatchJobAttachmentsIdFile.

effective_dating:
  description: >-
    SmartHR's HR records are bitemporal — changes can be booked with a future
    effective date. Webhook payloads always carry the employee state at send
    time; crew_updated fires on the effective date, not at booking time. The
    open-source activerecord-bitemporal gem (packages/) is the same data model.

sandbox:
  detail: sandbox/kufu-sandbox.yml
  base_url: https://{subdomain}.daruma.space/api
